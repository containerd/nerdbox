syntax = "proto3";

package containerd.vminitd.services.sharedresources.v1;

option go_package = "github.com/containerd/nerdbox/api/services/sharedresources/v1;sharedresources";

// SharedResources creates and deletes guest-side resources that containers
// sharing a sandbox use to share state with each other — Linux namespaces
// (IPC, PID, network) and other guest-side resources set up the same way
// (currently just a shared /dev/shm tmpfs) — and reports the guest paths at
// which they are pinned.
//
// Resources are addressed by a caller-chosen group id plus a type. A group
// is simply the set of resources sharing an id, so the caller decides
// whether resources are grouped (one id for every container of a sandbox,
// the usual case) or independent (a distinct id per container). Nothing here
// interprets the id beyond using it to key and name the resources.
//
// Creation is on demand and per type: a caller asks only for the types it
// actually needs, and only those are created. This matters because the cost
// is not uniform. A network or IPC namespace is created by unsharing it on a
// dedicated, locked OS thread and bind-mounting it to a well-known path; the
// bind mount alone keeps it alive afterwards, so it is cheap. A shared
// /dev/shm is a plain tmpfs mount, equally cheap. A PID namespace cannot
// work that way: unshare(CLONE_NEWPID) does not move the caller into the new
// namespace, only the caller's next child becomes its PID 1, and the kernel
// destroys the namespace the moment that PID 1 exits. It therefore requires
// a real, persistent anchor process, which is why asking for a PID namespace
// that is never used is worth avoiding.
service SharedResources {
	rpc Create(CreateRequest) returns (CreateResponse);
	rpc Delete(DeleteRequest) returns (DeleteResponse);
}

// Type identifies a kind of guest-side shared resource: created once per
// (group id, type) and addressed by a guest path thereafter. Most values are
// Linux namespace types; TYPE_DEVSHM is not — see its own comment.
enum Type {
	TYPE_UNSPECIFIED = 0;
	TYPE_NAMESPACE_IPC = 1;
	TYPE_NAMESPACE_PID = 2;
	TYPE_NAMESPACE_NETWORK = 3;
	// TYPE_DEVSHM is not an OCI namespace: it is a per-group tmpfs,
	// mounted once and reused, that sharing containers bind-mount their
	// /dev/shm onto so writes through it are real shared memory (guest
	// RAM), not just a shared IPC namespace identifier. It reuses this
	// same create-once/reuse/path-return mechanism because the shape of
	// the problem — and the "only pay for it if actually requested"
	// requirement — is identical to the namespace types.
	TYPE_DEVSHM = 4;
}

// SharedResource is a created resource and the guest path it is pinned at.
message SharedResource {
	Type type = 1;
	// path is a guest-side path. For a namespace type, it is a bind-mount
	// path suitable for use directly as an OCI runtime spec
	// LinuxNamespace.Path. For TYPE_DEVSHM, it is a directory suitable for
	// use as an OCI runtime spec Mount.Source with Type "bind".
	string path = 2;
}

message CreateRequest {
	// id groups the resources being created. Resources are created once
	// per (id, type) and reused, so repeating a request returns the paths
	// of the resources already created rather than creating new ones.
	string id = 1;
	// types are the resource types to create. Types already created for
	// id are returned without being recreated.
	repeated Type types = 2;
	// dev_shm_size_bytes is the tmpfs size to use when creating a
	// TYPE_DEVSHM resource for id for the first time. Ignored for every
	// other type, and ignored if a TYPE_DEVSHM resource for id already
	// exists (the size used by whichever caller created it first wins;
	// callers within one sandbox are expected to agree on it, since
	// containerd sends every member container of a pod the same /dev/shm
	// size). A value that is zero or absent falls back to a guest-side
	// default.
	int64 dev_shm_size_bytes = 3;
}

message CreateResponse {
	// resources contains one entry per requested type.
	repeated SharedResource resources = 1;
}

message DeleteRequest {
	// id is the group to delete resources from.
	string id = 1;
	// types are the resource types to delete. An empty list deletes every
	// resource belonging to id.
	//
	// Deleting a namespace that containers are still using is a caller
	// error: for a PID namespace it kills the anchor process, which makes
	// the kernel tear the namespace down and kill everything in it.
	repeated Type types = 2;
}

message DeleteResponse {}
