[package]
name = "nerdbox-pause"
version = "0.1.0"
description = "Anchor process holding a guest PID namespace open"
license = "Apache-2.0"
repository = "https://github.com/containerd/nerdbox"
homepage = "https://containerd.io"
edition = "2021"
publish = false

[dependencies]
# default-features = false drops libc's "std" feature, which this crate does
# not have available.
libc = { version = "0.2", default-features = false }

[profile.release]
# This binary is exec'd once per sandbox that shares a PID namespace, so what
# is being optimised for is process startup, not throughput. Keeping it small
# is what makes that startup cheap.
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
